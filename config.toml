# Configuration of tools/hf_roots.py — edited by hand.
#
# The tool scans every model of the organisations listed in [orgs], keeps the
# root ones (published by the lab that trained them: no third-party fine-tunes,
# quantizations, merges or adapters), and merges them into data/models.json.
# ROOTS.md is regenerated from that database at each run, newest first.

[criteria]
# README criterion 3: released after April 2024.
since = "2024-04-01"
# README criterion 2: Q4 footprint tiers, in GB (Q4 ≈ 0.55 bytes/param).
main_q4_gb = 128
extended_q4_gb = 256
# "llm" = text-generation, image-text-to-text, any-to-any... ; "all" = every pipeline.
pipelines = "llm"
# ROOTS.md shows a family once its likes (summed over its repos) reach this;
# below, it is tracked in data/models.json but not shown. Lab research
# checkpoints (hundreds at Ai2, NVIDIA, Google...) mostly stay under it.
report_min_likes = 50

[discovery]
# A global scan of Hugging Face sorted by likes, down to this many likes, is used
# to suggest organisations not followed yet (section "Suggested organisations").
min_likes = 100
# An unfollowed organisation is suggested when one of its roots has this many likes.
suggest_min_likes = 300

