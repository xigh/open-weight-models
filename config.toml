# Derivatives kept on purpose (exceptions to "root models only"): shown in
# their own section of ROOTS.md with their lineage. Same key format as [ignore].
[keep]
"nvidia/nvidia-nemotron-3.5-bolt-e4b" = "Philippe — NVIDIA post-training of google/gemma-4-E4B-it"
"nvidia/nvidia-nemotron-3.5-bolt-74b-a9b" = "Philippe — NVIDIA compression (Star Elastic) of Nemotron 3.5 Super-VL"

# Families or repos set aside: never listed as candidates, shown in their own
# section. Key = family ("author/name" lowercased, -Instruct/-Base/-FP8/date
# suffixes stripped) or exact repo id; value = reason.
[ignore]
